name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual "Run workflow" button - test build, no tag/release created

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=test-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Inject version into firmware
        run: |
          sed -i 's/#define KALEIDOBOX_VERSION ".*"/#define KALEIDOBOX_VERSION "${{ steps.version.outputs.VERSION }}"/' \
            main/version.h

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.4
          target: esp32s3
          command: idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build

      - name: Prepare release binaries
        run: |
          pip install esptool
          V=${{ steps.version.outputs.VERSION }}
          # Full-flash image for first-time flashing over USB at offset 0x0
          esptool.py --chip esp32s3 merge_bin \
            --output ${{ runner.temp }}/kaleidobox-full-$V.bin \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/kaleidobox.bin
          # App-only image for OTA updates via the web app
          cp build/kaleidobox.bin ${{ runner.temp }}/kaleidobox-app-$V.bin

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **`kaleidobox-full-${{ steps.version.outputs.VERSION }}.bin`** — full-flash image. Flash over USB at offset `0x0` (esptool / web flasher) for a first-time install.

            **`kaleidobox-app-${{ steps.version.outputs.VERSION }}.bin`** — app-only image. Upload via the web app (`http://kaleidobox.local`) to update an already-running device over the air.
          files: |
            ${{ runner.temp }}/kaleidobox-full-${{ steps.version.outputs.VERSION }}.bin
            ${{ runner.temp }}/kaleidobox-app-${{ steps.version.outputs.VERSION }}.bin

      - name: Upload test build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kaleidobox-${{ steps.version.outputs.VERSION }}
          path: |
            ${{ runner.temp }}/kaleidobox-full-${{ steps.version.outputs.VERSION }}.bin
            ${{ runner.temp }}/kaleidobox-app-${{ steps.version.outputs.VERSION }}.bin
          retention-days: 7
