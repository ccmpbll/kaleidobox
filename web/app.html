<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KaleidoBox</title>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiS2FsZWlkb0JveCIsInNob3J0X25hbWUiOiJLYWxlaWRvQm94Iiwic3RhcnRfdXJsIjoiLyIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6InJnYigxOCwxOCwyMCkiLCJ0aGVtZV9jb2xvciI6InJnYigxOCwxOCwyMCkiLCJpY29ucyI6W3sic3JjIjoiL2ljb24tNTEyLnBuZyIsInNpemVzIjoiNTEyeDUxMiIsInR5cGUiOiJpbWFnZS9wbmcifV19">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="icon" href="/kaleidobox.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KaleidoBox">
<meta name="theme-color" content="rgb(18,18,20)">
<style>
  /* Mobile-first - primary clients are an iPad and a phone, not desktop.
     Dark by design, not just prefers-color-scheme - the panel itself is
     usually viewed in a dim room, and a bright white page next to it was
     the actual complaint (not "add an option", just "make it dark"). */
  body{margin:0 auto;padding:16px;max-width:560px;box-sizing:border-box;
    background:rgb(18,18,20);color:rgb(230,230,232);
    font-family:-apple-system,BlinkMacSystemFont,
    'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  h1{font-size:1.2rem;font-weight:700;margin:0;}
  #header{display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img{height:72px;width:auto;display:block;}
  .brand-text{display:flex;flex-direction:column;gap:2px;}
  .brand-text p.sub{margin:0;}
  p.sub{margin:0 0 16px;color:rgb(150,150,160);font-size:.85rem;}
  /* Each logical group (Draw, Display, Kaleidoscope, Gallery) is its own
     bounded card, not just a text heading floating in the page flow -
     that's what actually makes section boundaries obvious at a glance,
     a bigger/bolder heading alone wasn't enough. */
  .section{background:rgb(24,24,28);border:1px solid rgb(42,42,50);
    border-radius:10px;padding:14px 16px;margin-bottom:16px;}
  .section h2{font-size:.8rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;color:rgb(140,165,255);margin:0 0 4px;}
  .section p.sub{margin:0 0 10px;}
  /* Small uppercase label splitting a section into distinct groups of
     controls - used inside Gallery, which was the specific complaint
     (name field/save/upload/prev/next/rotation all blurring together). */
  .subLabel{font-size:.7rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;color:rgb(130,130,145);margin:14px 0 6px;}
  .subLabel:first-of-type{margin-top:0;}
  .canvasWrap{position:relative;width:100%;max-width:512px;aspect-ratio:1;
    border-radius:8px;overflow:hidden;margin-bottom:14px;}
  #canvas{display:block;position:absolute;inset:0;width:100%;height:100%;
    background:#000;touch-action:none;image-rendering:pixelated;}
  /* Faint per-pixel grid, purely visual (drawn on a separate layer, not
     the canvas itself). A single SVG scaled as one image (background-size
     100% 100%, no repeat) - NOT a small tile repeated 64 times. A tiled
     gradient (the first version of this) drifted out of alignment with
     the canvas's own pixels: the canvas bitmap's upscale and the tiled
     background's per-tile rounding are two independent sub-pixel
     roundings that don't agree, and the error compounds over 64 repeats
     (caught by the user on real hardware - visibly off, worse toward the
     far edge). A single image scaled once has nothing to compound - it
     tracks the canvas's own width:100% scaling directly. The SVG's own
     viewBox is 0..64 with a line at every integer, so cell count is
     exactly 64 by construction, not by matching two separate CSS values.
     mix-blend-mode:difference instead of a fixed white/black line - a
     flat-opacity white line disappears entirely against a white pixel
     (same problem in reverse for black against black). Difference
     against a mid-gray inverts relative to whatever's underneath, so it
     reads as a visible line against both extremes instead of just one. */
  .canvasGrid{position:absolute;inset:0;pointer-events:none;
    mix-blend-mode:difference;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20d%3D%22M1%200V64M0%201H64M2%200V64M0%202H64M3%200V64M0%203H64M4%200V64M0%204H64M5%200V64M0%205H64M6%200V64M0%206H64M7%200V64M0%207H64M8%200V64M0%208H64M9%200V64M0%209H64M10%200V64M0%2010H64M11%200V64M0%2011H64M12%200V64M0%2012H64M13%200V64M0%2013H64M14%200V64M0%2014H64M15%200V64M0%2015H64M16%200V64M0%2016H64M17%200V64M0%2017H64M18%200V64M0%2018H64M19%200V64M0%2019H64M20%200V64M0%2020H64M21%200V64M0%2021H64M22%200V64M0%2022H64M23%200V64M0%2023H64M24%200V64M0%2024H64M25%200V64M0%2025H64M26%200V64M0%2026H64M27%200V64M0%2027H64M28%200V64M0%2028H64M29%200V64M0%2029H64M30%200V64M0%2030H64M31%200V64M0%2031H64M32%200V64M0%2032H64M33%200V64M0%2033H64M34%200V64M0%2034H64M35%200V64M0%2035H64M36%200V64M0%2036H64M37%200V64M0%2037H64M38%200V64M0%2038H64M39%200V64M0%2039H64M40%200V64M0%2040H64M41%200V64M0%2041H64M42%200V64M0%2042H64M43%200V64M0%2043H64M44%200V64M0%2044H64M45%200V64M0%2045H64M46%200V64M0%2046H64M47%200V64M0%2047H64M48%200V64M0%2048H64M49%200V64M0%2049H64M50%200V64M0%2050H64M51%200V64M0%2051H64M52%200V64M0%2052H64M53%200V64M0%2053H64M54%200V64M0%2054H64M55%200V64M0%2055H64M56%200V64M0%2056H64M57%200V64M0%2057H64M58%200V64M0%2058H64M59%200V64M0%2059H64M60%200V64M0%2060H64M61%200V64M0%2061H64M62%200V64M0%2062H64M63%200V64M0%2063H64%22%20stroke%3D%22gray%22%20stroke-width%3D%220.08%22%20fill%3D%22none%22/%3E%3C/svg%3E");
    background-size: 100% 100%;
    background-repeat: no-repeat;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    max-width:512px;}
  .controls + .controls{margin-top:10px;}
  .controls label{display:flex;align-items:center;gap:6px;font-size:.85rem;}
  input[type=color]{width:44px;height:36px;padding:2px;border:1px solid
    rgb(60,60,68);border-radius:6px;background:rgb(28,28,32);}
  button{padding:10px 16px;border:none;border-radius:6px;
    background:linear-gradient(217deg,#4c6ef5,#22b8cf);color:#fff;
    font-size:.9rem;font-weight:600;cursor:pointer;}
  button:active{opacity:.85;}
  button.secondary{background:rgb(45,45,52);color:rgb(230,230,232);}
  button.danger{background:linear-gradient(217deg,#e03131,#ff6b6b);color:#fff;}
  button:disabled{opacity:.5;cursor:default;}
  .uploadLabel{padding:10px 16px;border-radius:6px;background:rgb(45,45,52);
    color:rgb(230,230,232);font-size:.9rem;font-weight:600;cursor:pointer;}
  .uploadLabel:active{opacity:.85;}
  .settingsLink{color:rgb(140,165,255);font-size:.8rem;text-decoration:none;
    white-space:nowrap;}
  .settingsLink:active{opacity:.7;}
  #galleryList{display:flex;flex-direction:column;gap:6px;margin-top:10px;
    max-width:512px;}
  .galleryItem{display:flex;align-items:center;gap:10px;padding:8px 10px;
    background:rgb(28,28,32);border:1px solid rgb(55,55,62);
    border-radius:6px;cursor:pointer;}
  .galleryItem:active{background:rgb(42,42,58);}
  .galleryItem canvas{width:40px;height:40px;flex-shrink:0;
    border-radius:4px;background:#000;image-rendering:pixelated;}
  .galleryItem .name{flex:1;min-width:0;font-size:.85rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .galleryItem button.delete{background:none;padding:8px;border-radius:6px;
    color:rgb(255,130,130);display:flex;flex-shrink:0;}
  .galleryItem button.delete:active{background:rgba(255,100,100,.15);
    opacity:1;}
  #galleryEmpty{font-size:.85rem;color:rgb(150,150,160);}
  input[type=text],input[type=number],select{padding:8px 10px;border:1px solid
    rgb(60,60,68);border-radius:6px;font-size:.9rem;min-width:0;flex:1;
    background:rgb(28,28,32);color:rgb(230,230,232);}
  input[type=number]{flex:none;}
  select{flex:none;}
  /* Small-phone tightening - tap targets and spacing shrink a bit
     rather than wrapping into a cramped, hard-to-tap mess. */
  @media (max-width:380px){
    body{padding:12px;}
    button,.uploadLabel{padding:9px 12px;font-size:.85rem;}
    .controls{gap:8px;}
  }
</style>
</head>
<body>
<div id="header">
  <div class="brand">
    <img src="/kaleidobox.png" alt="">
    <div class="brand-text">
      <h1>KaleidoBox</h1>
      <p class="sub">Draw, browse the gallery, or animate a kaleidoscope on the panel.</p>
    </div>
  </div>
  <a class="settingsLink" href="/settings">Settings</a>
</div>

<div class="section">
  <h2>Draw</h2>
  <div class="canvasWrap">
    <canvas id="canvas" width="64" height="64"></canvas>
    <div class="canvasGrid"></div>
  </div>
  <div class="controls">
    <label>Color <input type="color" id="color" value="#ffffff"></label>
    <label><input type="checkbox" id="instant" checked> Instant draw</label>
    <button type="button" id="submit" hidden>Submit</button>
    <button type="button" class="danger" id="clear" style="margin-left:auto;">CLEAR/STOP</button>
  </div>
</div>

<div class="section">
  <h2>Kaleidoscope</h2>
  <p class="sub">Animates whatever's currently on the panel (drawn or uploaded).</p>
  <div class="controls">
    <button type="button" id="kaleidoToggle">Start</button>
    <label>Fold <input type="range" id="foldCount" min="2" max="32" value="8">
      <input type="number" id="foldCountNum" min="2" max="32" value="8" style="width:52px;"></label>
    <label><input type="checkbox" id="motionZoom"> Zoom</label>
  </div>
</div>

<div class="section">
  <h2>Gallery</h2>
  <p class="sub">Tap a saved image to show it on the panel.</p>

  <p class="subLabel">Add an image</p>
  <div class="controls">
    <input type="text" id="gallerySaveName" placeholder="Name to save as" maxlength="48">
    <button type="button" id="gallerySave">Save current</button>
    <label id="galleryUploadLabel" class="uploadLabel" for="galleryUpload"><span id="galleryUploadLabelText">Upload to gallery</span></label>
    <input type="file" id="galleryUpload" accept="image/jpeg,image/png" style="display:none;">
  </div>

  <p class="subLabel">Browse</p>
  <div class="controls">
    <button type="button" class="secondary" id="galleryPrev">&larr; Prev</button>
    <button type="button" class="secondary" id="galleryNext">Next &rarr;</button>
    <button type="button" id="galleryAutoToggle">Start rotation</button>
  </div>
  <div class="controls">
    <label>Every <input type="range" id="galleryInterval" min="5" max="300" value="30" style="width:100px;">
      <input type="number" id="galleryIntervalNum" min="5" max="300" value="30" style="width:56px;">s</label>
  </div>
  <p id="gallerySpace" class="sub" style="margin-top:10px;"></p>

  <div id="galleryList"></div>
</div>
<script>
(function () {
  var W = 64, H = 64;
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var buffer = new Uint8Array(W * H * 3); // local mirror, used for Clear/Submit
  var colorInput = document.getElementById('color');
  var instantCheckbox = document.getElementById('instant');
  var submitBtn = document.getElementById('submit');
  var clearBtn = document.getElementById('clear');
  var ws = null;
  var drawing = false;
  var lastCell = null; // [x,y] of the last cell painted this stroke, or
                        // null at the start of a stroke - used to
                        // interpolate a line to the next reported cell,
                        // since pointermove doesn't sample continuously
                        // and a fast drag can otherwise jump over cells.

  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function paintLocal(x, y, r, g, b) {
    var idx = (y * W + x) * 3;
    buffer[idx] = r; buffer[idx + 1] = g; buffer[idx + 2] = b;
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.fillRect(x, y, 1, 1);
  }

  // Standard Bresenham line - every grid cell between (x0,y0) and
  // (x1,y1) inclusive, no gaps.
  function lineCells(x0, y0, x1, y1) {
    var cells = [];
    var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    var dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    var err = dx + dy, e2;
    while (true) {
      cells.push([x0, y0]);
      if (x0 === x1 && y0 === y1) {
        break;
      }
      e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    return cells;
  }

  function ensureWs() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
      return;
    }
    ws = new WebSocket('ws://' + location.host + '/ws/draw');
  }

  function sendBatch(pixels) {
    if (!instantCheckbox.checked || pixels.length === 0) {
      return;
    }
    ensureWs();
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({pixels: pixels}));
    }
    // If the socket is still CONNECTING, this batch is dropped -
    // acceptable for a live-draw stream (not queued/guaranteed
    // delivery); the next batch sends fine once the socket is open.
  }

  function cellFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var x = Math.floor((e.clientX - rect.left) * (W / rect.width));
    var y = Math.floor((e.clientY - rect.top) * (H / rect.height));
    x = Math.max(0, Math.min(W - 1, x));
    y = Math.max(0, Math.min(H - 1, y));
    return [x, y];
  }

  function handlePointer(e) {
    var cell = cellFromEvent(e);
    var cells;
    if (!lastCell) {
      cells = [cell];
    } else if (lastCell[0] === cell[0] && lastCell[1] === cell[1]) {
      return; // pointer moved but stayed in the same cell - nothing new
    } else {
      cells = lineCells(lastCell[0], lastCell[1], cell[0], cell[1]).slice(1); // skip lastCell, already painted
    }
    lastCell = cell;

    var rgb = hexToRgb(colorInput.value);
    var batch = [];
    for (var i = 0; i < cells.length; i++) {
      paintLocal(cells[i][0], cells[i][1], rgb[0], rgb[1], rgb[2]);
      batch.push({x: cells[i][0], y: cells[i][1], r: rgb[0], g: rgb[1], b: rgb[2]});
    }
    sendBatch(batch);
  }

  canvas.addEventListener('pointerdown', function (e) {
    drawing = true;
    lastCell = null;
    canvas.setPointerCapture(e.pointerId);
    handlePointer(e);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (drawing) {
      handlePointer(e);
    }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
    canvas.addEventListener(evt, function () { drawing = false; lastCell = null; });
  });

  instantCheckbox.addEventListener('change', function () {
    submitBtn.hidden = instantCheckbox.checked;
    if (instantCheckbox.checked) {
      ensureWs();
    }
  });

  clearBtn.addEventListener('click', function () {
    buffer.fill(0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    // Tap-to-load pre-fills this with the loaded entry's name so
    // re-saving overwrites it (see gallery tap-to-show) - if that
    // name's still sitting there after a Clear, hitting "Save current"
    // would blank out that real gallery entry. Clearing the canvas
    // clears the intent to overwrite anything.
    gallerySaveName.value = '';
    resumeAutoAdvanceIfPaused(); // in case the save-name field left it paused

    // Clear means stop everything and start fresh - kaleidoscope and
    // gallery rotation would otherwise keep animating/cycling right
    // over the blank canvas this is about to push. Both awaited before
    // the actual clear, same reasoning as kaleidoscope alone used to
    // have: kaleidoscope_stop() restores the pre-animation image, so
    // letting that (or a rotation cycle) land after the clear would
    // silently undo it.
    var stopKaleido = kaleidoRunning ? sendKaleidoSettings({enabled: false}) : Promise.resolve();
    var stopRotation = galleryAutoRunning ? (function () {
      galleryAutoRunning = false;
      return sendGalleryMode();
    })() : Promise.resolve();

    Promise.all([stopKaleido, stopRotation])
      .then(function () {
        kaleidoRunning = false;
        kaleidoToggle.textContent = 'Start';
        setGalleryAutoButtonText();
        updateGalleryPolling();
        return fetch('/api/canvas/submit', {method: 'POST', body: buffer});
      })
      .catch(function () {});
  });

  submitBtn.addEventListener('click', function () {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    fetch('/api/canvas/submit', {method: 'POST', body: buffer})
      .then(function () { submitBtn.textContent = 'Submitted'; })
      .catch(function () { submitBtn.textContent = 'Failed - retry'; })
      .finally(function () {
        setTimeout(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit';
        }, 1200);
      });
  });

  if (instantCheckbox.checked) {
    ensureWs();
  }

  // Repaint from whatever's actually on the panel right now - the local
  // buffer above starts all-zero on every page load/refresh, which
  // doesn't reflect device state (draw and gallery both leave something
  // on the panel that persists across refreshes).
  function refreshCanvasPreview() {
    return fetch('/api/canvas')
      .then(function (r) { return r.arrayBuffer(); })
      .then(function (ab) {
        var bytes = new Uint8Array(ab);
        buffer.set(bytes);
        var imgData = ctx.createImageData(W, H);
        for (var i = 0, p = 0; i < W * H; i++, p += 4) {
          imgData.data[p] = bytes[i * 3];
          imgData.data[p + 1] = bytes[i * 3 + 1];
          imgData.data[p + 2] = bytes[i * 3 + 2];
          imgData.data[p + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
      });
  }
  refreshCanvasPreview().catch(function () {});

  var kaleidoToggle = document.getElementById('kaleidoToggle');
  var foldCount = document.getElementById('foldCount');
  var foldCountNum = document.getElementById('foldCountNum');
  var motionZoom = document.getElementById('motionZoom');
  var kaleidoRunning = false;

  function sendKaleidoSettings(extra) {
    var body = {fold_count: parseInt(foldCount.value, 10), motion_zoom: motionZoom.checked};
    if (extra) {
      for (var k in extra) { body[k] = extra[k]; }
    }
    return fetch('/api/kaleidoscope', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  }

  // If it's already running, a settings-only POST updates the saved
  // value but the running animation task only reads fold_count/
  // motion_zoom once at its own start - it won't pick up the change.
  // Sending enabled:true too triggers a clean restart (start() already
  // stops-then-restarts cleanly) so a live change actually takes effect
  // instead of silently doing nothing until the next manual stop/start.
  function applyKaleidoSettings() {
    sendKaleidoSettings(kaleidoRunning ? {enabled: true} : null).catch(function () {});
  }

  // Range and number input mirror each other - either one is the
  // source of truth depending on which the user touched last.
  foldCount.addEventListener('input', function () { foldCountNum.value = foldCount.value; });
  foldCountNum.addEventListener('input', function () {
    var v = foldCountNum.value;
    if (v !== '') { foldCount.value = v; }
  });
  foldCount.addEventListener('change', applyKaleidoSettings);
  foldCountNum.addEventListener('change', function () {
    var v = Math.max(2, Math.min(32, parseInt(foldCountNum.value, 10) || 2));
    foldCountNum.value = v;
    foldCount.value = v;
    applyKaleidoSettings();
  });
  motionZoom.addEventListener('change', applyKaleidoSettings);

  kaleidoToggle.addEventListener('click', function () {
    kaleidoToggle.disabled = true;
    sendKaleidoSettings({enabled: !kaleidoRunning})
      .then(function (r) { return r.json(); })
      .then(function (s) {
        kaleidoRunning = !!s.running;
        kaleidoToggle.textContent = kaleidoRunning ? 'Stop' : 'Start';
      })
      .catch(function () {})
      .finally(function () { kaleidoToggle.disabled = false; });
  });

  fetch('/api/kaleidoscope').then(function (r) { return r.json(); }).then(function (s) {
    foldCount.value = s.fold_count;
    foldCountNum.value = s.fold_count;
    motionZoom.checked = !!s.motion_zoom;
    kaleidoRunning = !!s.running;
    kaleidoToggle.textContent = kaleidoRunning ? 'Stop' : 'Start';
  }).catch(function () {});

  var galleryList = document.getElementById('galleryList');
  var gallerySaveName = document.getElementById('gallerySaveName');
  var gallerySaveBtn = document.getElementById('gallerySave');
  var galleryUploadInput = document.getElementById('galleryUpload');
  var galleryUploadLabelText = document.getElementById('galleryUploadLabelText');
  var galleryPrevBtn = document.getElementById('galleryPrev');
  var galleryNextBtn = document.getElementById('galleryNext');
  var galleryAutoBtn = document.getElementById('galleryAutoToggle');
  var galleryAutoRunning = false;
  var galleryInterval = document.getElementById('galleryInterval');
  var galleryIntervalNum = document.getElementById('galleryIntervalNum');

  var TRASH_ICON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" ' +
    'fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<polyline points="3 6 5 6 21 6"></polyline>' +
    '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>' +
    '<path d="M10 11v6"></path><path d="M14 11v6"></path>' +
    '<path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';

  function paintThumb(canvasEl, bytes) {
    var tctx = canvasEl.getContext('2d');
    var imgData = tctx.createImageData(W, H);
    for (var i = 0, p = 0; i < W * H; i++, p += 4) {
      imgData.data[p] = bytes[i * 3];
      imgData.data[p + 1] = bytes[i * 3 + 1];
      imgData.data[p + 2] = bytes[i * 3 + 2];
      imgData.data[p + 3] = 255;
    }
    tctx.putImageData(imgData, 0, 0);
  }

  function formatBytes(n) {
    var units = ['B', 'KB', 'MB', 'GB'];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(1)) + units[i];
  }

  function refreshGalleryList() {
    fetch('/api/gallery').then(function (r) { return r.json(); }).then(function (s) {
      var gallerySpace = document.getElementById('gallerySpace');
      if (typeof s.sdcard_total_bytes === 'number') {
        var used = s.sdcard_total_bytes - s.sdcard_free_bytes;
        gallerySpace.textContent = 'TF card: ' + formatBytes(used) + ' used, ' +
          formatBytes(s.sdcard_free_bytes) + ' free of ' + formatBytes(s.sdcard_total_bytes);
      } else {
        gallerySpace.textContent = 'No TF card detected.';
      }

      var images = s.images || [];
      galleryList.innerHTML = '';
      if (images.length === 0) {
        galleryList.innerHTML = '<span id="galleryEmpty">No saved images yet.</span>';
        return;
      }
      images.forEach(function (name) {
        var row = document.createElement('div');
        row.className = 'galleryItem';

        var thumb = document.createElement('canvas');
        thumb.width = W;
        thumb.height = H;
        row.appendChild(thumb);

        var label = document.createElement('span');
        label.className = 'name';
        label.textContent = name;
        row.appendChild(label);

        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'delete';
        delBtn.title = 'Delete ' + name;
        delBtn.innerHTML = TRASH_ICON_SVG;
        delBtn.addEventListener('click', function (e) {
          e.stopPropagation(); // don't also trigger the row's "show this image" click
          fetch('/api/gallery/' + encodeURIComponent(name), {method: 'DELETE'})
            .then(refreshGalleryList)
            .catch(function () {});
        });
        row.appendChild(delBtn);

        row.addEventListener('click', function () {
          fetch('/api/gallery/show/' + encodeURIComponent(name), {method: 'POST'})
            .then(refreshCanvasPreview)
            .catch(function () {});
          // Pre-fills the save name with the one just loaded - draw on
          // top and hit "Save current" and it overwrites this same
          // entry (gallery_save() already overwrites-by-name on the
          // device, nothing new needed there), since the name field
          // still holds it unless you change it first. Change the name
          // instead to save as a new entry.
          gallerySaveName.value = name;
        });

        galleryList.appendChild(row);

        fetch('/api/gallery/image/' + encodeURIComponent(name))
          .then(function (r) { return r.arrayBuffer(); })
          .then(function (ab) { paintThumb(thumb, new Uint8Array(ab)); })
          .catch(function () {});
      });
    }).catch(function () {});
  }

  // Auto-advance can swap the canvas out from under a slow save - type
  // a name while it's cycling and the image you meant to save may
  // already be gone by the time you hit the button, saving whatever
  // replaced it instead (gallery_save() always saves "whatever's on
  // canvas right now", which is a moving target while cycling). Pause
  // the device's own auto-advance the moment the name field gets
  // focus, freezing the canvas, and resume once the save completes.
  // Safety-net timeout in case the field is focused and abandoned
  // without saving, so auto-advance can't get stuck off.
  var pausedForSave = false;
  var pauseTimeoutId = null;

  function pauseAutoAdvanceForSave() {
    if (!galleryAutoRunning || pausedForSave) {
      return;
    }
    pausedForSave = true;
    fetch('/api/gallery/mode', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({auto_advance: false, interval_seconds: parseInt(galleryInterval.value, 10)}),
    }).catch(function () {});
    clearTimeout(pauseTimeoutId);
    pauseTimeoutId = setTimeout(resumeAutoAdvanceIfPaused, 60000);
  }

  function resumeAutoAdvanceIfPaused() {
    clearTimeout(pauseTimeoutId);
    if (!pausedForSave) {
      return;
    }
    pausedForSave = false;
    if (galleryAutoRunning) {
      sendGalleryMode().catch(function () {}); // button state was never touched - this just re-enables it device-side
    }
  }

  gallerySaveName.addEventListener('focus', pauseAutoAdvanceForSave);

  gallerySaveBtn.addEventListener('click', function () {
    var name = gallerySaveName.value.trim();
    if (!name) {
      return;
    }
    gallerySaveBtn.disabled = true;
    fetch('/api/gallery/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name}),
    })
      .then(function () { gallerySaveName.value = ''; refreshGalleryList(); })
      .catch(function () {})
      .finally(function () {
        gallerySaveBtn.disabled = false;
        resumeAutoAdvanceIfPaused();
      });
  });

  // Defaults the gallery name to the picked file's own filename - the
  // backend only rejects '/' and '.' in a name (see gallery.c's
  // name_is_valid()), and real filenames often carry an extension
  // (and occasionally extra dots), so strip the extension and swap any
  // remaining '/' or '.' for '_' rather than reject those file names.
  function nameFromFilename(filename) {
    var withoutExt = filename.replace(/\.[^./]*$/, '');
    return withoutExt.replace(/[/.]/g, '_').trim().slice(0, 48);
  }

  // Separate from the "Upload picture" control above - this decodes
  // straight into a named gallery entry (POST /api/gallery/upload/name)
  // without ever touching the live canvas, unlike a regular upload.
  galleryUploadInput.addEventListener('change', function () {
    var file = galleryUploadInput.files[0];
    if (!file) {
      return;
    }
    var original = galleryUploadLabelText.textContent;
    // Typed name (if any) wins - only fall back to the filename when
    // the field's actually empty, so deliberate naming still works.
    var name = gallerySaveName.value.trim() || nameFromFilename(file.name);
    if (!name) {
      galleryUploadLabelText.textContent = 'Could not name this file - rename it and retry';
      galleryUploadInput.value = '';
      setTimeout(function () { galleryUploadLabelText.textContent = original; }, 2000);
      return;
    }
    galleryUploadLabelText.textContent = 'Uploading…';
    fetch('/api/gallery/upload/' + encodeURIComponent(name), {method: 'POST', body: file})
      .then(function (r) {
        galleryUploadLabelText.textContent = r.ok ? 'Uploaded!' : 'Failed - retry';
        if (r.ok) {
          gallerySaveName.value = '';
          refreshGalleryList();
        }
      })
      .catch(function () { galleryUploadLabelText.textContent = 'Failed - retry'; })
      .finally(function () {
        galleryUploadInput.value = '';
        resumeAutoAdvanceIfPaused(); // in case focusing the name field paused it and this upload was the only follow-up action
        setTimeout(function () { galleryUploadLabelText.textContent = original; }, 1500);
      });
  });

  galleryPrevBtn.addEventListener('click', function () {
    fetch('/api/gallery/prev', {method: 'POST'}).then(refreshCanvasPreview).catch(function () {});
  });
  galleryNextBtn.addEventListener('click', function () {
    fetch('/api/gallery/next', {method: 'POST'}).then(refreshCanvasPreview).catch(function () {});
  });

  function sendGalleryMode() {
    return fetch('/api/gallery/mode', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        auto_advance: galleryAutoRunning,
        interval_seconds: parseInt(galleryInterval.value, 10),
      }),
    });
  }

  function setGalleryAutoButtonText() {
    galleryAutoBtn.textContent = galleryAutoRunning ? 'Stop rotation' : 'Start rotation';
  }

  // The device cycles the gallery on its own timer while auto-advance is
  // on (see gallery.c's background task) - without this, the browser's
  // canvas preview just sits on whatever was showing when the page
  // loaded and never reflects what the panel's actually cycled to since.
  // Polls at a fixed cadence rather than matching interval_seconds
  // exactly - simpler, and the bandwidth cost (one 12KB fetch/2s) is
  // negligible on a LAN.
  var galleryPollTimer = null;
  function updateGalleryPolling() {
    if (galleryAutoRunning && !galleryPollTimer) {
      galleryPollTimer = setInterval(function () { refreshCanvasPreview().catch(function () {}); }, 2000);
    } else if (!galleryAutoRunning && galleryPollTimer) {
      clearInterval(galleryPollTimer);
      galleryPollTimer = null;
    }
  }

  // Range and number input mirror each other, same pattern as fold count.
  galleryInterval.addEventListener('input', function () { galleryIntervalNum.value = galleryInterval.value; });
  galleryIntervalNum.addEventListener('input', function () {
    var v = galleryIntervalNum.value;
    if (v !== '') { galleryInterval.value = v; }
  });

  galleryAutoBtn.addEventListener('click', function () {
    galleryAutoBtn.disabled = true;
    galleryAutoRunning = !galleryAutoRunning;
    sendGalleryMode()
      .catch(function () {})
      .finally(function () {
        setGalleryAutoButtonText();
        updateGalleryPolling();
        galleryAutoBtn.disabled = false;
      });
  });

  galleryInterval.addEventListener('change', function () { sendGalleryMode().catch(function () {}); });
  galleryIntervalNum.addEventListener('change', function () {
    var v = Math.max(5, Math.min(300, parseInt(galleryIntervalNum.value, 10) || 5));
    galleryIntervalNum.value = v;
    galleryInterval.value = v;
    sendGalleryMode().catch(function () {});
  });

  refreshGalleryList();
  fetch('/api/gallery/mode').then(function (r) { return r.json(); }).then(function (s) {
    galleryAutoRunning = !!s.auto_advance;
    setGalleryAutoButtonText();
    updateGalleryPolling();
    galleryInterval.value = s.interval_seconds;
    galleryIntervalNum.value = s.interval_seconds;
  }).catch(function () {});
})();
</script>
</body>
</html>
