<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KaleidoBox</title>
<style>
  /* Mobile-first - primary clients are an iPad and a phone, not desktop. */
  body{margin:0;padding:16px;background:rgb(245,242,240);
    color:rgb(41,41,41);font-family:-apple-system,BlinkMacSystemFont,
    'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  h1{font-size:1.2rem;font-weight:700;margin:0 0 4px;}
  h2{font-size:1rem;font-weight:700;margin:20px 0 4px;}
  p.sub{margin:0 0 16px;color:rgb(130,120,110);font-size:.85rem;}
  #canvas{display:block;width:100%;max-width:512px;aspect-ratio:1;
    background:#000;border-radius:8px;touch-action:none;
    image-rendering:pixelated;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin-top:14px;max-width:512px;}
  .controls label{display:flex;align-items:center;gap:6px;font-size:.85rem;}
  input[type=color]{width:44px;height:36px;padding:2px;border:1px solid
    rgb(200,195,190);border-radius:6px;background:#fff;}
  button{padding:8px 14px;border:none;border-radius:6px;
    background:linear-gradient(217deg,#4c6ef5,#22b8cf);color:#fff;
    font-size:.9rem;font-weight:600;cursor:pointer;}
  button:active{opacity:.85;}
  button.secondary{background:rgb(230,226,222);color:rgb(41,41,41);}
  button:disabled{opacity:.5;cursor:default;}
  #uploadLabel{padding:8px 14px;border-radius:6px;background:rgb(230,226,222);
    color:rgb(41,41,41);font-size:.9rem;font-weight:600;cursor:pointer;}
  #uploadLabel:active{opacity:.85;}
  #status{margin-top:16px;font-size:.8rem;color:rgb(130,120,110);}
  #galleryList{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;
    max-width:512px;}
  #galleryList button{background:rgb(230,226,222);color:rgb(41,41,41);
    font-weight:500;}
  #galleryList button.active{background:linear-gradient(217deg,#4c6ef5,
    #22b8cf);color:#fff;}
  #galleryEmpty{font-size:.85rem;color:rgb(130,120,110);}
  input[type=text]{padding:8px 10px;border:1px solid rgb(200,195,190);
    border-radius:6px;font-size:.9rem;min-width:0;flex:1;}
</style>
</head>
<body>
<h1>KaleidoBox</h1>
<p class="sub">Draw, upload, or animate a kaleidoscope on the panel.</p>
<canvas id="canvas" width="64" height="64"></canvas>
<div class="controls">
  <label>Color <input type="color" id="color" value="#ffffff"></label>
  <label><input type="checkbox" id="instant" checked> Instant draw</label>
  <button type="button" class="secondary" id="clear">Clear</button>
  <button type="button" id="submit" hidden>Submit</button>
  <label id="uploadLabel" for="upload"><span id="uploadLabelText">Upload picture</span></label>
  <input type="file" id="upload" accept="image/jpeg,image/png" style="display:none;">
</div>
<h2>Kaleidoscope</h2>
<p class="sub">Animates whatever's currently on the panel (drawn or uploaded).</p>
<div class="controls">
  <button type="button" id="kaleidoToggle">Start</button>
  <label>Fold <input type="range" id="foldCount" min="2" max="32" value="8"><span id="foldCountVal">8</span></label>
  <label><input type="checkbox" id="motionZoom"> Zoom</label>
</div>
<h2>Gallery</h2>
<p class="sub">Save the current panel to the TF card, or cycle through saved images.</p>
<div class="controls">
  <input type="text" id="gallerySaveName" placeholder="Name to save as" maxlength="48">
  <button type="button" id="gallerySave">Save current</button>
</div>
<div class="controls">
  <button type="button" class="secondary" id="galleryPrev">&larr; Prev</button>
  <button type="button" class="secondary" id="galleryNext">Next &rarr;</button>
  <label><input type="checkbox" id="galleryAuto"> Auto-advance every
    <input type="range" id="galleryInterval" min="5" max="300" value="30" style="width:100px;">
    <span id="galleryIntervalVal">30</span>s</label>
</div>
<div id="galleryList"></div>
<p id="status">Loading status&hellip;</p>
<script>
(function () {
  var W = 64, H = 64;
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var buffer = new Uint8Array(W * H * 3); // local mirror, used for Clear/Submit
  var colorInput = document.getElementById('color');
  var instantCheckbox = document.getElementById('instant');
  var submitBtn = document.getElementById('submit');
  var clearBtn = document.getElementById('clear');
  var ws = null;
  var drawing = false;
  var lastCell = null; // [x,y] of the last cell painted this stroke, or
                        // null at the start of a stroke - used to
                        // interpolate a line to the next reported cell,
                        // since pointermove doesn't sample continuously
                        // and a fast drag can otherwise jump over cells.

  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function paintLocal(x, y, r, g, b) {
    var idx = (y * W + x) * 3;
    buffer[idx] = r; buffer[idx + 1] = g; buffer[idx + 2] = b;
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.fillRect(x, y, 1, 1);
  }

  // Standard Bresenham line - every grid cell between (x0,y0) and
  // (x1,y1) inclusive, no gaps.
  function lineCells(x0, y0, x1, y1) {
    var cells = [];
    var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    var dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    var err = dx + dy, e2;
    while (true) {
      cells.push([x0, y0]);
      if (x0 === x1 && y0 === y1) {
        break;
      }
      e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    return cells;
  }

  function ensureWs() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
      return;
    }
    ws = new WebSocket('ws://' + location.host + '/ws/draw');
  }

  function sendBatch(pixels) {
    if (!instantCheckbox.checked || pixels.length === 0) {
      return;
    }
    ensureWs();
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({pixels: pixels}));
    }
    // If the socket is still CONNECTING, this batch is dropped -
    // acceptable for a live-draw stream (not queued/guaranteed
    // delivery); the next batch sends fine once the socket is open.
  }

  function cellFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var x = Math.floor((e.clientX - rect.left) * (W / rect.width));
    var y = Math.floor((e.clientY - rect.top) * (H / rect.height));
    x = Math.max(0, Math.min(W - 1, x));
    y = Math.max(0, Math.min(H - 1, y));
    return [x, y];
  }

  function handlePointer(e) {
    var cell = cellFromEvent(e);
    var cells;
    if (!lastCell) {
      cells = [cell];
    } else if (lastCell[0] === cell[0] && lastCell[1] === cell[1]) {
      return; // pointer moved but stayed in the same cell - nothing new
    } else {
      cells = lineCells(lastCell[0], lastCell[1], cell[0], cell[1]).slice(1); // skip lastCell, already painted
    }
    lastCell = cell;

    var rgb = hexToRgb(colorInput.value);
    var batch = [];
    for (var i = 0; i < cells.length; i++) {
      paintLocal(cells[i][0], cells[i][1], rgb[0], rgb[1], rgb[2]);
      batch.push({x: cells[i][0], y: cells[i][1], r: rgb[0], g: rgb[1], b: rgb[2]});
    }
    sendBatch(batch);
  }

  canvas.addEventListener('pointerdown', function (e) {
    drawing = true;
    lastCell = null;
    canvas.setPointerCapture(e.pointerId);
    handlePointer(e);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (drawing) {
      handlePointer(e);
    }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
    canvas.addEventListener(evt, function () { drawing = false; lastCell = null; });
  });

  instantCheckbox.addEventListener('change', function () {
    submitBtn.hidden = instantCheckbox.checked;
    if (instantCheckbox.checked) {
      ensureWs();
    }
  });

  clearBtn.addEventListener('click', function () {
    buffer.fill(0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    // Stop a running kaleidoscope first, and wait for it, before pushing
    // the clear - otherwise kaleidoscope_stop()'s own "restore the
    // original image" behavior can land after our clear and undo it.
    var stopKaleido = kaleidoRunning ? sendKaleidoSettings({enabled: false}) : Promise.resolve();
    stopKaleido
      .then(function () {
        kaleidoRunning = false;
        kaleidoToggle.textContent = 'Start';
        return fetch('/api/canvas/submit', {method: 'POST', body: buffer});
      })
      .catch(function () {});
  });

  submitBtn.addEventListener('click', function () {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    fetch('/api/canvas/submit', {method: 'POST', body: buffer})
      .then(function () { submitBtn.textContent = 'Submitted'; })
      .catch(function () { submitBtn.textContent = 'Failed - retry'; })
      .finally(function () {
        setTimeout(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit';
        }, 1200);
      });
  });

  var uploadInput = document.getElementById('upload');
  var uploadLabelText = document.getElementById('uploadLabelText');
  uploadInput.addEventListener('change', function () {
    var file = uploadInput.files[0];
    if (!file) {
      return;
    }

    // Local preview only - draws the picked image scaled into our 64x64
    // canvas via the browser's own image decode/scale (native feature,
    // no server round trip needed just to preview). The real panel
    // comes from the device's own authoritative box-filter decode of
    // the original file, sent separately below - this is an
    // approximation for what's shown here in the browser, nothing more.
    var objectUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      ctx.drawImage(img, 0, 0, W, H);
      var pixels = ctx.getImageData(0, 0, W, H).data;
      for (var i = 0, p = 0; i < W * H; i++, p += 4) {
        buffer[i * 3] = pixels[p];
        buffer[i * 3 + 1] = pixels[p + 1];
        buffer[i * 3 + 2] = pixels[p + 2];
      }
      URL.revokeObjectURL(objectUrl);
    };
    img.src = objectUrl;

    var original = uploadLabelText.textContent;
    uploadLabelText.textContent = 'Uploading…';
    fetch('/api/upload', {method: 'POST', body: file})
      .then(function (r) {
        uploadLabelText.textContent = r.ok ? 'Uploaded!' : 'Failed - retry';
      })
      .catch(function () { uploadLabelText.textContent = 'Failed - retry'; })
      .finally(function () {
        uploadInput.value = '';
        setTimeout(function () { uploadLabelText.textContent = original; }, 1500);
      });
  });

  if (instantCheckbox.checked) {
    ensureWs();
  }

  // Repaint from whatever's actually on the panel right now - the local
  // buffer above starts all-zero on every page load/refresh, which
  // doesn't reflect device state (draw, upload, and gallery all leave
  // something on the panel that persists across refreshes).
  function refreshCanvasPreview() {
    return fetch('/api/canvas')
      .then(function (r) { return r.arrayBuffer(); })
      .then(function (ab) {
        var bytes = new Uint8Array(ab);
        buffer.set(bytes);
        var imgData = ctx.createImageData(W, H);
        for (var i = 0, p = 0; i < W * H; i++, p += 4) {
          imgData.data[p] = bytes[i * 3];
          imgData.data[p + 1] = bytes[i * 3 + 1];
          imgData.data[p + 2] = bytes[i * 3 + 2];
          imgData.data[p + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
      });
  }
  refreshCanvasPreview().catch(function () {});

  var kaleidoToggle = document.getElementById('kaleidoToggle');
  var foldCount = document.getElementById('foldCount');
  var foldCountVal = document.getElementById('foldCountVal');
  var motionZoom = document.getElementById('motionZoom');
  var kaleidoRunning = false;

  function sendKaleidoSettings(extra) {
    var body = {fold_count: parseInt(foldCount.value, 10), motion_zoom: motionZoom.checked};
    if (extra) {
      for (var k in extra) { body[k] = extra[k]; }
    }
    return fetch('/api/kaleidoscope', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  }

  // If it's already running, a settings-only POST updates the saved
  // value but the running animation task only reads fold_count/
  // motion_zoom once at its own start - it won't pick up the change.
  // Sending enabled:true too triggers a clean restart (start() already
  // stops-then-restarts cleanly) so a live change actually takes effect
  // instead of silently doing nothing until the next manual stop/start.
  function applyKaleidoSettings() {
    sendKaleidoSettings(kaleidoRunning ? {enabled: true} : null).catch(function () {});
  }

  foldCount.addEventListener('input', function () { foldCountVal.textContent = foldCount.value; });
  foldCount.addEventListener('change', applyKaleidoSettings);
  motionZoom.addEventListener('change', applyKaleidoSettings);

  kaleidoToggle.addEventListener('click', function () {
    kaleidoToggle.disabled = true;
    sendKaleidoSettings({enabled: !kaleidoRunning})
      .then(function (r) { return r.json(); })
      .then(function (s) {
        kaleidoRunning = !!s.running;
        kaleidoToggle.textContent = kaleidoRunning ? 'Stop' : 'Start';
      })
      .catch(function () {})
      .finally(function () { kaleidoToggle.disabled = false; });
  });

  fetch('/api/kaleidoscope').then(function (r) { return r.json(); }).then(function (s) {
    foldCount.value = s.fold_count;
    foldCountVal.textContent = s.fold_count;
    motionZoom.checked = !!s.motion_zoom;
    kaleidoRunning = !!s.running;
    kaleidoToggle.textContent = kaleidoRunning ? 'Stop' : 'Start';
  }).catch(function () {});

  fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
    document.getElementById('status').textContent =
      'KaleidoBox ' + s.version + ' - ' + (s.wifi_ssid || 'no wifi') +
      ' - up ' + s.uptime_seconds + 's';
  }).catch(function () {
    document.getElementById('status').textContent = 'Status unavailable';
  });

  var galleryList = document.getElementById('galleryList');
  var gallerySaveName = document.getElementById('gallerySaveName');
  var gallerySaveBtn = document.getElementById('gallerySave');
  var galleryPrevBtn = document.getElementById('galleryPrev');
  var galleryNextBtn = document.getElementById('galleryNext');
  var galleryAuto = document.getElementById('galleryAuto');
  var galleryInterval = document.getElementById('galleryInterval');
  var galleryIntervalVal = document.getElementById('galleryIntervalVal');

  function refreshGalleryList() {
    fetch('/api/gallery').then(function (r) { return r.json(); }).then(function (s) {
      var images = s.images || [];
      galleryList.innerHTML = '';
      if (images.length === 0) {
        galleryList.innerHTML = '<span id="galleryEmpty">No saved images yet.</span>';
        return;
      }
      images.forEach(function (name) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = name + ' ×';
        btn.title = 'Delete ' + name;
        btn.addEventListener('click', function () {
          fetch('/api/gallery/' + encodeURIComponent(name), {method: 'DELETE'})
            .then(refreshGalleryList)
            .catch(function () {});
        });
        galleryList.appendChild(btn);
      });
    }).catch(function () {});
  }

  gallerySaveBtn.addEventListener('click', function () {
    var name = gallerySaveName.value.trim();
    if (!name) {
      return;
    }
    gallerySaveBtn.disabled = true;
    fetch('/api/gallery/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name}),
    })
      .then(function () { gallerySaveName.value = ''; refreshGalleryList(); })
      .catch(function () {})
      .finally(function () { gallerySaveBtn.disabled = false; });
  });

  galleryPrevBtn.addEventListener('click', function () {
    fetch('/api/gallery/prev', {method: 'POST'}).then(refreshCanvasPreview).catch(function () {});
  });
  galleryNextBtn.addEventListener('click', function () {
    fetch('/api/gallery/next', {method: 'POST'}).then(refreshCanvasPreview).catch(function () {});
  });

  function sendGalleryMode() {
    return fetch('/api/gallery/mode', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        auto_advance: galleryAuto.checked,
        interval_seconds: parseInt(galleryInterval.value, 10),
      }),
    });
  }
  galleryInterval.addEventListener('input', function () {
    galleryIntervalVal.textContent = galleryInterval.value;
  });
  galleryAuto.addEventListener('change', function () { sendGalleryMode().catch(function () {}); });
  galleryInterval.addEventListener('change', function () { sendGalleryMode().catch(function () {}); });

  refreshGalleryList();
  fetch('/api/gallery/mode').then(function (r) { return r.json(); }).then(function (s) {
    galleryAuto.checked = !!s.auto_advance;
    galleryInterval.value = s.interval_seconds;
    galleryIntervalVal.textContent = s.interval_seconds;
  }).catch(function () {});
})();
</script>
</body>
</html>
