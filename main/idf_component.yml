dependencies:
  idf: ">=5.3.0"
  espressif/mdns: "^1.2.0"
  # Matrix driver stack - isolated behind matrix.cpp's plain C API (see
  # matrix.h). Confirmed via Waveshare's own official ESP-IDF example for
  # this exact board (github.com/waveshareteam/ESP32-S3-RGB-Matrix,
  # example/idf_v5.5.2/components/bsp/esp32_s3_matrix/idf_component.yml) -
  # esp-hub75 is a pure ESP-IDF component, no Arduino/Adafruit_GFX compat
  # layer needed (that was this scaffold's first-pass assumption, now
  # corrected). Not yet actually used by anything but matrix.cpp's stub.
  esphome/esp-hub75: "^0.3.5"
  # JPEG decode (main/image_decode.c) is `libjpeg-turbo`, a LOCAL
  # component under ../components/libjpeg-turbo, not fetched via the
  # component manager here - see that directory's own note for why.
  # PNG decode uses vendored main/lodepng.c/.h instead - no ESP-IDF
  # component exists for PNG, and lodepng compiles as plain C (its
  # optional C++ wrapper is gated behind __cplusplus/LODEPNG_COMPILE_CPP,
  # unused here).
